
name: Unpack mod archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "ZIP archive not found in repository root"
            exit 1
          fi
          mkdir -p /tmp/riftprisoner
          unzip -o "$ARCHIVE" -d /tmp/riftprisoner
          cp -a /tmp/riftprisoner/. .
          rm -f "$ARCHIVE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract mod source archive" || exit 0
          git push
